spring.application.name=CorazonDeJesus

# En la computadora usa el perfil local.
# En Railway utilizaremos el perfil de producción.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# Seguridad JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}

server.forward-headers-strategy=framework

# Usuarios iniciales
# Los valores reales se configurarán de forma privada en Railway.
app.initial.admin-password=${ADMIN_INITIAL_PASSWORD:}
app.initial.gregorio-password=${GREGORIO_INITIAL_PASSWORD:}

# Direcciones permitidas para utilizar el backend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}